name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release --workspace --lib --bins
      - run: cargo test --release --workspace --doc

  validation:
    name: validation tests (reference server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Host limits
        run: |
          nproc
          ulimit -n
          cat /proc/sys/net/ipv4/ip_local_port_range
      - run: cargo test --release -p diapason-cli --test validation
      - name: Keep the summaries of the validation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summaries
          path: target/tmp/validation/*.json

  macos:
    name: build and unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace --lib
      - run: cargo test --release --workspace --doc
      - name: Timer precision on this runner
        if: always()
        run: |
          ./target/release/diapason server --listen 127.0.0.1:18080 --workers 8 --threads 2 &
          sleep 1
          ./target/release/diapason run --url http://127.0.0.1:18080/ --rate 2000 --duration 4s \
            --threads 2 --connections 64 --seed 1 --quiet --summary lag.json || true
          python3 -c "import json; s=json.load(open('lag.json')); l=next(p for p in s['phases'] if p['measured'])['latency']['generator_lag']; print('::notice title=generator lag (ms)::p50 %.3f p90 %.3f p99 %.3f max %.3f, exit %d' % (l['p50_ms'], l['p90_ms'], l['p99_ms'], l['max_ms'], s['exit_code']))"
          kill %1 || true
      - run: ./target/release/diapason selftest
