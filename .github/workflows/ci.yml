name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release --workspace --lib --bins --doc

  validation:
    name: validation tests (reference server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Host limits
        run: |
          nproc
          ulimit -n
          cat /proc/sys/net/ipv4/ip_local_port_range
      - run: cargo test --release -p diapason-cli --test validation
      - name: Keep the summaries of the validation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summaries
          path: target/tmp/validation/*.json

  macos:
    name: build and unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace --lib --doc
      - run: ./target/release/diapason selftest
