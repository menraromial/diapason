name: Release

# On main, builds the binaries when the code or the packaging changes, so
# that a broken target shows before a release. A v* tag always builds and
# publishes the release (GitHub does not apply path filters to tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - install.sh
      - .github/workflows/release.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --profile dist --locked -p diapason-cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        run: |
          ./target/${{ matrix.target }}/dist/diapason --version
          ./target/${{ matrix.target }}/dist/diapason selftest --duration 2s || true
      - name: Package
        shell: bash
        run: |
          name=diapason-${{ matrix.target }}
          mkdir -p "$name" dist
          cp target/${{ matrix.target }}/dist/diapason README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: diapason-${{ matrix.target }}
          path: dist/*

  release:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          Install the binary for your system:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/menraromial/diapason/main/install.sh | sh
          ```

          Each archive has a `.sha256` file next to it.
          EOF
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: diapason ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
